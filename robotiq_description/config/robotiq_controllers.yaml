controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController  # <--- Updated to match your system's exact plugin class

    robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController

robotiq_gripper_controller:
  ros__parameters:
    use_sim_time: true
    joint: robotiq_85_finger_1_knuckle_joint

    # Humble standard configuration parameters
    state_interfaces: ["position", "velocity"]
    command_interfaces: ["position"]
    allow_stalling: true
    stall_timeout: 0.05
    goal_tolerance: 0.02

robotiq_activation_controller:
  ros__parameters:
    use_sim_time: true
    default: true